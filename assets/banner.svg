<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
  <defs>
    <linearGradient id="dbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040b17"/>
      <stop offset="50%" stop-color="#0b1b36"/>
      <stop offset="100%" stop-color="#02060f"/>
    </linearGradient>
    <linearGradient id="daccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <pattern id="dgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0e2a52" stroke-width="1" opacity="0.6"/>
    </pattern>
    <filter id="dglow"><feGaussianBlur stdDeviation="6" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Canvas Base -->
  <rect width="1500" height="500" fill="url(#dbg)"/>
  <rect width="1500" height="500" fill="url(#dgrid)"/>

  <!-- Left: Cybernetic Vault Shield & Document Layers -->
  <g transform="translate(190, 250)">
    <!-- Hexagonal Outer Vault -->
    <polygon points="0,-130 112,-65 112,65 0,130 -112,65 -112,-65" fill="#08182f" stroke="#0284c7" stroke-width="3" filter="url(#dglow)"/>
    <polygon points="0,-115 99,-57 99,57 0,115 -99,57 -99,-57" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 6"/>

    <!-- Document Sheets with Laser Scan -->
    <rect x="-45" y="-55" width="70" height="95" rx="5" fill="#0f294d" stroke="#1e4e8c" stroke-width="2"/>
    <rect x="-35" y="-45" width="70" height="95" rx="5" fill="#133666" stroke="#0284c7" stroke-width="2"/>
    <rect x="-25" y="-35" width="70" height="95" rx="5" fill="#184685" stroke="#38bdf8" stroke-width="2.5"/>

    <!-- Document Text Lines -->
    <line x1="-12" y1="-20" x2="30" y2="-20" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-12" y1="-8" x2="30" y2="-8" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-12" y1="4" x2="18" y2="4" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-12" y1="16" x2="25" y2="16" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-12" y1="28" x2="30" y2="28" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round"/>

    <!-- OCR Glowing Scan Line -->
    <line x1="-50" y1="0" x2="70" y2="0" stroke="#00f2fe" stroke-width="3" filter="url(#dglow)"/>
    <circle cx="70" cy="0" r="4" fill="#00f2fe"/>
  </g>

  <!-- Right: Architecture Matrix Nodes -->
  <g transform="translate(1120, 150)" opacity="0.6">
    <circle cx="60" cy="60" r="28" fill="#081f3d" stroke="#0284c7" stroke-width="2"/>
    <circle cx="180" cy="40" r="22" fill="#081f3d" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="140" cy="160" r="32" fill="#081f3d" stroke="#00f2fe" stroke-width="2.5"/>
    <circle cx="240" cy="140" r="18" fill="#081f3d" stroke="#0284c7" stroke-width="1.5"/>
    <!-- Connectors -->
    <line x1="60" y1="60" x2="180" y2="40" stroke="#0284c7" stroke-width="2" stroke-dasharray="4 4"/>
    <line x1="60" y1="60" x2="140" y2="160" stroke="#38bdf8" stroke-width="2"/>
    <line x1="180" y1="40" x2="240" y2="140" stroke="#0284c7" stroke-width="1.5"/>
    <line x1="140" y1="160" x2="240" y2="140" stroke="#00f2fe" stroke-width="2"/>
    <!-- Node icons -->
    <text x="60" y="65" font-family="'Consolas', monospace" font-size="12" fill="#38bdf8" text-anchor="middle">OCR</text>
    <text x="180" y="45" font-family="'Consolas', monospace" font-size="11" fill="#7dd3fc" text-anchor="middle">RAG</text>
    <text x="140" y="165" font-family="'Consolas', monospace" font-size="13" fill="#00f2fe" text-anchor="middle">VAULT</text>
  </g>

  <!-- Typography & Badges -->
  <g transform="translate(390, 160)">
    <!-- Badge -->
    <rect x="0" y="0" width="260" height="30" rx="6" fill="#082245" stroke="#0284c7" stroke-width="1.5"/>
    <text x="130" y="20" font-family="'Consolas', monospace" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="2">[ ENTERPRISE AI DMS ]</text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="'Segoe UI', 'Arial Black', sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="4">DOKA AI DMS</text>
    
    <!-- Accent Line -->
    <rect x="0" y="105" width="620" height="4" rx="2" fill="url(#daccent)"/>

    <!-- Tagline -->
    <text x="0" y="150" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="500" fill="#94a3b8" letter-spacing="1">Safety-First Document Intelligence &amp; Autonomous Processing</text>
    
    <!-- Sub-pills -->
    <g transform="translate(0, 185)" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
      <rect x="0" y="0" width="140" height="28" rx="6" fill="#081c38" stroke="#0284c7" stroke-width="1"/>
      <text x="70" y="18" fill="#bae6fd" text-anchor="middle">OCR PIPELINE</text>
      <rect x="155" y="0" width="165" height="28" rx="6" fill="#081c38" stroke="#0284c7" stroke-width="1"/>
      <text x="237" y="18" fill="#bae6fd" text-anchor="middle">HYBRID STORAGE</text>
      <rect x="335" y="0" width="150" height="28" rx="6" fill="#081c38" stroke="#0284c7" stroke-width="1"/>
      <text x="410" y="18" fill="#bae6fd" text-anchor="middle">SEMANTIC SEARCH</text>
      <rect x="500" y="0" width="140" height="28" rx="6" fill="#081c38" stroke="#0284c7" stroke-width="1"/>
      <text x="570" y="18" fill="#bae6fd" text-anchor="middle">TELEGRAM BOT</text>
    </g>
  </g>
</svg>