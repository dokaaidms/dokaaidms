<path d="M160 455 Q800 315 1440 455" fill="none" stroke="url(#cyan)" stroke-width="2" opacity=".8"/>
<g text-anchor="middle" font-family="Arial,Helvetica,sans-serif">
 <text x="800" y="228" font-size="142" font-weight="800" letter-spacing="14" fill="#eaf7ff">DOKA</text>
 <path d="M590 252H1010" stroke="url(#cyan)" stroke-width="3" filter="url(#shine)"/>
 <text x="800" y="310" font-size="31" font-weight="700" letter-spacing="4" fill="#f2f8ff">BUILDING IDEAS INTO REAL-WORLD SOFTWARE</text>
 <text x="800" y="365" font-size="19" letter-spacing="5" fill="#66dfff">AI  •  FULL-STACK  •  AUTOMATION  •  CLOUD SYSTEMS</text>
 <text x="800" y="485" font-size="13" letter-spacing="3" fill="#91a9c9">FOUNDER &amp; INDEPENDENT DEVELOPER</text>
