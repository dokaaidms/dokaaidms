<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
<title id="title">Doka — Building ideas into real-world software</title>
<desc id="desc">A dark navy technology banner with cyan and violet network graphics, a glowing digital horizon, and the Doka brand.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050b18"/><stop offset=".55" stop-color="#07172b"/><stop offset="1" stop-color="#100d2b"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#37d8ff"/><stop offset=".52" stop-color="#8deaff"/><stop offset="1" stop-color="#6d7cff"/></linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#334dff" stop-opacity="0"/><stop offset=".5" stop-color="#8a5cff"/><stop offset="1" stop-color="#334dff" stop-opacity="0"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#12bfff" stop-opacity=".28"/><stop offset="1" stop-color="#12bfff" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#6aa8ff" stroke-opacity=".07" stroke-width="1"/></pattern>
  <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
  <filter id="shine"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1600" height="520" rx="28" fill="url(#bg)"/><rect width="1600" height="520" rx="28" fill="url(#grid)"/>
<ellipse cx="800" cy="430" rx="650" ry="180" fill="url(#glow)"/>
<g fill="none" stroke-linecap="round">
