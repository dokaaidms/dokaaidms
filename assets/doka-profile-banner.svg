<g fill="#57dfff" filter="url(#shine)"><circle cx="65" cy="80" r="4"/><circle cx="180" cy="45" r="4"/><circle cx="270" cy="110" r="4"/><circle cx="365" cy="52" r="4"/><circle cx="480" cy="95" r="4"/><circle cx="1120" cy="70" r="4"/><circle cx="1230" cy="35" r="4"/><circle cx="1330" cy="92" r="4"/><circle cx="1445" cy="48" r="4"/><circle cx="1540" cy="100" r="4"/></g>
