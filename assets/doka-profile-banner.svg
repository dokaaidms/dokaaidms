 <path d="M-30 395 Q220 250 460 385 T980 370 T1640 330" stroke="url(#cyan)" stroke-width="2" opacity=".35"/>
 <path d="M-30 430 Q220 285 460 420 T980 405 T1640 365" stroke="url(#violet)" stroke-width="2" opacity=".6"/>
</g>
<g stroke="#42cfff" stroke-opacity=".32" fill="none">
 <path d="M65 80 180 45 270 110 365 52 480 95 M1120 70 1230 35 1330 92 1445 48 1540 100 M90 315 190 260 295 325 390 270 M1200 300 1310 250 1410 315 1510 260" />
 <path d="M180 45 190 260 M270 110 295 325 M365 52 390 270 M1230 35 1200 300 M1330 92 1310 250 M1445 48 1410 315" stroke-opacity=".18"/>
